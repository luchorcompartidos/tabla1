<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablas "Dinámicas"</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #fafafa;
    margin: 0;
    padding: 30px 16px;
  }
  #sheet-sync-container {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    padding: 20px 24px;
  }
  #sheet-sync-container h1 {
    font-size: 18px;
    margin: 0 0 16px 0;
  }
  .sheet-sync-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .sheet-sync-header span {
    font-size: 13px;
    color: #666;
  }
  #sheet-sync-refresh {
    font-size: 12px;
    padding: 4px 10px;
    border: 1px solid #ccc;
    background: #f7f7f7;
    border-radius: 6px;
    cursor: pointer;
  }
  #sheet-sync-refresh:hover { background: #eee; }
  #sheet-sync-count {
    font-size: 13px;
    color: #666;
    margin-bottom: 8px;
  }
  #sheet-sync-status {
    font-size: 13px;
    color: #999;
    margin-bottom: 8px;
    min-height: 16px;
  }

  /* --- Vista de tabla --- */
  #sheet-sync-hidden-legend {
    margin-bottom: 8px;
    font-size: 12px;
    color: #666;
  }
  #sheet-sync-hidden-legend a {
    color: #1a73e8;
    text-decoration: none;
    margin-right: 12px;
    cursor: pointer;
  }
  #sheet-sync-hidden-legend a:hover {
    text-decoration: underline;
  }
  #sheet-sync-table-wrapper {
    overflow-x: auto;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
  }
  #sheet-sync-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  #sheet-sync-table thead th {
    background: #1a2b1a;
    color: #fff;
    font-weight: 600;
    text-align: left;
    padding: 10px 12px;
    white-space: nowrap;
    position: sticky;
    top: 0;
    cursor: pointer;
    user-select: none;
  }
  #sheet-sync-table thead th:hover {
    background: #2c452c;
  }
  #sheet-sync-table thead th::after {
    content: " ⏷";
    font-size: 10px;
    opacity: 0.6;
  }
  #sheet-sync-table tbody td {
    padding: 8px 12px;
    border-bottom: 1px solid #eee;
    vertical-align: top;
  }
  #sheet-sync-table tbody tr:nth-child(even) {
    background: #fafafa;
  }
  #sheet-sync-table tbody tr:hover {
    background: #f0f4f0;
  }
  #sheet-sync-table td a,
  #sheet-sync-table th a {
    color: #1a73e8;
    text-decoration: none;
  }
  #sheet-sync-table td a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div id="sheet-sync-container">
  <h1>Tabla: </h1>
  <div class="sheet-sync-header">
    <span>Última sincronización: <span id="sheet-sync-time">—</span></span>
    <button id="sheet-sync-refresh">Actualizar ahora</button>
  </div>
  <div id="sheet-sync-count"></div>
  <div id="sheet-sync-status"></div>
  <div id="sheet-sync-hidden-legend"></div>
  <div id="sheet-sync-table-wrapper">
    <table id="sheet-sync-table">
      <thead>
        <tr id="sheet-sync-table-head"></tr>
      </thead>
      <tbody id="sheet-sync-table-body"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  // --- Configuración ---
  // Esta app NO busca columnas por nombre. Toma todas las columnas que
  // existan en la planilla, en el orden en que aparezcan, y decide cómo
  // mostrar cada valor según su propio contenido (por ejemplo, si "parece"
  // una URL o no). Si agregás, quitás o reordenás columnas en la planilla,
  // la página se adapta sola sin tocar el código.
  const SHEET_ID = "1dkGOT3XaPuHa8Kpj_UpD_sKkSGCs_1P5HyL_Z2IIcmQ";
  const GID = "0";
  const REFRESH_MS = 86400000; // vuelve a sincronizar cada 24 horas
  const URL_REGEX = /^https?:\/\//i;

  // "headers=1" le indica explícitamente a Google que la fila 1 es el
  // encabezado. Sin este parámetro, si la planilla no lo detecta sola,
  // los encabezados quedan vacíos y la fila 1 se cuela como si fuera
  // el primer registro de datos.
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&headers=1`;

  const statusEl = document.getElementById("sheet-sync-status");
  const timeEl = document.getElementById("sheet-sync-time");
  const countEl = document.getElementById("sheet-sync-count");
  const theadRowEl = document.getElementById("sheet-sync-table-head");
  const tbodyEl = document.getElementById("sheet-sync-table-body");
  const legendEl = document.getElementById("sheet-sync-hidden-legend");

  // Estado en memoria (se conserva entre sincronizaciones automáticas,
  // pero se recalcula si desaparece del todo la planilla). Se guarda por
  // NOMBRE de columna, no por posición, para que no se desarme si la
  // planilla cambia el orden de las columnas.
  let currentHeaders = [];
  let currentDataRows = [];
  const hiddenColumns = new Set();

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Devuelve el valor de una celda como texto, o "" si está vacía / no existe
  function cellValue(row, colIndex) {
    const cell = row.c[colIndex];
    if (!cell || cell.v === null || cell.v === undefined) return "";
    const str = String(cell.v).trim();
    return str;
  }

  // Igual que cellValue, pero SIN recortar espacios. Se usa solo para la
  // primera columna, porque ahí un espacio en blanco (" ") debe contar
  // como "tiene un carácter" y no como celda vacía.
  function cellValueRaw(row, colIndex) {
    const cell = row.c[colIndex];
    if (!cell || cell.v === null || cell.v === undefined) return "";
    return String(cell.v);
  }

  function isUrl(value) {
    return URL_REGEX.test(value);
  }

  // A partir de una URL, arma un texto de enlace legible sin depender del
  // nombre de la columna: usa el dominio (sin "www."), que suele bastar
  // para identificar de qué servicio se trata (spotify, youtube, etc).
  function linkLabelFromUrl(value) {
    try {
      const host = new URL(value).hostname.replace(/^www\./, "");
      return host;
    } catch (e) {
      return "Abrir enlace";
    }
  }

  function formatValue(value) {
    if (value === "") return "";
    if (isUrl(value)) {
      const safeUrl = escapeHtml(value);
      const label = escapeHtml(linkLabelFromUrl(value));
      return `<a href="${safeUrl}" target="_blank" rel="noopener">${label}</a>`;
    }
    return escapeHtml(value);
  }

  // Dibuja la tabla (encabezado + filas) a partir de currentHeaders y
  // currentDataRows, respetando qué columnas están ocultas en este momento.
  // No vuelve a pedir datos a la planilla: solo redibuja lo que ya está
  // en memoria, así que ocultar/mostrar columnas es instantáneo.
  function renderTable() {
    const visibleIndexes = currentHeaders
      .map((_, i) => i)
      .filter(i => !hiddenColumns.has(currentHeaders[i]));

    // Encabezado: cada <th> es clickeable y oculta su columna.
    theadRowEl.innerHTML = visibleIndexes
      .map(i => `<th data-col-index="${i}" title="Click para ocultar esta columna">${escapeHtml(currentHeaders[i])}</th>`)
      .join("");

    theadRowEl.querySelectorAll("th").forEach(th => {
      th.addEventListener("click", () => {
        const idx = Number(th.getAttribute("data-col-index"));
        hiddenColumns.add(currentHeaders[idx]);
        renderTable();
      });
    });

    // Leyenda de columnas ocultas, tipo hipervínculo: "Mostrar NombreColumna".
    if (hiddenColumns.size > 0) {
      legendEl.innerHTML = Array.from(hiddenColumns)
        .map(name => `<a data-col-name="${escapeHtml(name)}">Mostrar ${escapeHtml(name)}</a>`)
        .join("");

      legendEl.querySelectorAll("a").forEach(a => {
        a.addEventListener("click", () => {
          const name = a.getAttribute("data-col-name");
          hiddenColumns.delete(name);
          renderTable();
        });
      });
    } else {
      legendEl.innerHTML = "";
    }

    // Cuerpo de la tabla: solo se listan las columnas visibles, en el
    // mismo orden que el encabezado.
    tbodyEl.innerHTML = currentDataRows
      .map(values => {
        const cellsHtml = visibleIndexes
          .map(i => `<td>${formatValue(values[i])}</td>`)
          .join("");
        return `<tr>${cellsHtml}</tr>`;
      })
      .join("");

    if (!tbodyEl.innerHTML) {
      const colspan = visibleIndexes.length || 1;
      tbodyEl.innerHTML = `<tr><td colspan="${colspan}" style="color:#999;">No se encontraron registros.</td></tr>`;
    }
  }

  async function syncSheet() {
    statusEl.textContent = "Sincronizando...";
    try {
      const res = await fetch(url);
      const text = await res.text();
      // La respuesta viene envuelta como: google.visualization.Query.setResponse({...});
      const json = JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1));
      const rows = json.table.rows;
      const cols = json.table.cols;

      // Encabezados dinámicos, en el orden en que figuran en la planilla.
      // Si una columna no tiene encabezado, se le pone un nombre genérico.
      const allHeaders = cols.map((c, i) => (c.label && c.label.trim()) || `Columna ${i + 1}`);

      // Arma la lista de registros (filas con al menos un dato en la
      // primera columna) manteniendo el orden y las columnas originales
      // de la planilla, celda por celda.
      const allDataRows = rows
        .map(r => {
          // La primera columna decide si el registro existe: si no tiene
          // NINGÚN carácter se descarta. Si tiene al menos un carácter
          // (aunque sea un espacio en blanco " "), el registro se toma.
          const firstColRaw = cellValueRaw(r, 0);
          if (firstColRaw.length === 0) return null;

          // El resto de las columnas se toma tal cual viene (recortando
          // espacios), respetando la posición original de cada una.
          const restValues = allHeaders.slice(1).map((_, i) => cellValue(r, i + 1));

          return [firstColRaw, ...restValues];
        })
        .filter(values => values !== null); // descarta solo las filas sin primera columna

      // La última columna a mostrar es la última que tenga datos en ALGUNA
      // fila (no la última que exista en la planilla). Así, si la planilla
      // trae columnas vacías al final (por celdas en blanco o fórmulas sin
      // usar), no se muestran como columnas vacías en la tabla.
      let lastColWithData = -1;
      allDataRows.forEach(values => {
        for (let i = values.length - 1; i > lastColWithData; i--) {
          if (values[i] !== "") {
            lastColWithData = i;
            break;
          }
        }
      });
      const visibleColCount = lastColWithData + 1;

      currentHeaders = allHeaders.slice(0, visibleColCount);
      currentDataRows = allDataRows.map(values => values.slice(0, visibleColCount));

      countEl.textContent = `Actualizados: ${currentDataRows.length} Registros`;

      renderTable();

      statusEl.textContent = "";
      timeEl.textContent = new Date().toLocaleTimeString();
    } catch (err) {
      statusEl.textContent = "No se pudo sincronizar. Verificá que la hoja sea pública ('cualquiera con el enlace').";
      console.error(err);
    }
  }

  document.getElementById("sheet-sync-refresh").addEventListener("click", syncSheet);
  syncSheet();
  setInterval(syncSheet, REFRESH_MS);
})();
</script>

</body>
</html>
